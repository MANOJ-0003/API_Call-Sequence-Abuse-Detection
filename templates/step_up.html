<!DOCTYPE html>
<html>
<head>
    <title>API Sentinel Verification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="auth-page">
    <section class="auth-card">
        <div class="brand"><div class="brand-mark">S</div><div><p class="brand-title">API Sentinel</p><p class="brand-subtitle">Adaptive Step-Up Authentication</p></div></div>
        <p class="eyebrow">Sensitive operation protected</p>
        <h1>Verify before {{ api_name }}</h1>
        <p class="subtext">Earlier workflow risk requires an additional verification before this sensitive API can continue.</p>
        {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
        <form method="post" action="/verify-step-up">
            <input type="hidden" name="user" value="{{ user }}">
            <input type="hidden" name="api_name" value="{{ api_name }}">
            <label for="otp">One-time verification code</label>
            <input id="otp" name="otp" inputmode="numeric" maxlength="6" placeholder="Demo code: 123456" required>
            <button type="submit">Verify and continue</button>
        </form>
    </section>
</main>
</body>
</html>
