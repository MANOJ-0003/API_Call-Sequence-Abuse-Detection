<!DOCTYPE html>
<html>
<head>
    <title>Verify Email | API Sentinel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="auth-page">
    <section class="auth-card">
        <div class="brand"><div class="brand-mark">S</div><div><p class="brand-title">API Sentinel</p><p class="brand-subtitle">Email Authentication</p></div></div>
        <p class="eyebrow">Account activation</p>
        <h1>Verify your email</h1>
        <p class="subtext">Enter the six-digit code sent to {{ email }}. It expires in 10 minutes.</p>
        {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
        <form action="/verify-email" method="post">
            <input type="hidden" name="user" value="{{ user }}">
            <input type="text" name="email_otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="Email OTP" required>
            <button type="submit">Verify Email and Activate Account</button>
        </form>
        <div class="action-row"><a class="button button-secondary" href="/register">Start Again</a></div>
    </section>
</main>
</body>
</html>
